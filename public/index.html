<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cheesequake</title>
<style>
:root { --bg:#f6f5f1; --fg:#1d1d1b; --mut:#6b6a63; --card:#fff; --line:#dedbd0; --acc:#c47f00; --good:#2b7a3d; --bad:#b3261e; --mid:#8a5a00; }
@media (prefers-color-scheme: dark) { :root { --bg:#151513; --fg:#ecebe4; --mut:#9a988c; --card:#1f1f1c; --line:#33332e; --acc:#e8a317; --good:#5fc27a; --bad:#f2766d; --mid:#e8a317; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, sans-serif; }
header { padding:16px; border-bottom:1px solid var(--line); }
h1 { margin:0; font-size:20px; }
.note { color:var(--mut); font-size:13px; margin:2px 0 0; }
nav { display:flex; gap:4px; padding:8px 16px 0; flex-wrap:wrap; }
nav button { background:none; border:0; border-bottom:2px solid transparent; color:var(--mut); padding:8px 12px; font:inherit; cursor:pointer; min-height:44px; }
nav button[aria-selected="true"] { color:var(--fg); border-color:var(--acc); }
main { padding:16px; max-width:1100px; }
section[hidden] { display:none; }
.card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:12px; overflow-x:auto; }
.card > p.mut { margin:0; }
h2 { font-size:16px; margin:0 0 6px; }
table { border-collapse:collapse; width:100%; font-size:14px; }
th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
th { color:var(--mut); font-weight:500; }
.big { font-size:44px; font-weight:600; line-height:1; }
.zone { color:var(--acc); font-size:18px; margin-left:8px; }
.mut { color:var(--mut); }
input, select { font:inherit; padding:6px 8px; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:8px; }
input { width:min(100%, 420px); }
.go { font:inherit; font-weight:500; min-height:36px; padding:4px 12px; background:var(--acc); color:#111; border:0; border-radius:8px; cursor:pointer; }
.go.quiet { background:none; color:var(--fg); border:1px solid var(--line); }
a { color:var(--acc); }
svg { max-width:100%; height:auto; }
.grid { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 64px minmax(0,1fr) minmax(0,1.1fr) minmax(0,1.6fr) auto; gap:12px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
.acts { display:flex; gap:6px; flex-wrap:wrap; }
.whead { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
.wstatus { padding:8px 12px; border:1px solid var(--line); border-left:3px solid currentColor; border-radius:6px; margin:6px 0 10px; }
.wstatus strong { display:block; font-size:13px; margin-bottom:4px; }
.wmeta { display:flex; gap:16px; flex-wrap:wrap; color:var(--mut); font-size:13px; margin:6px 0 10px; }
.wreasons { margin:0; padding-left:18px; color:var(--fg); }
.wreasons li { margin:2px 0; }
.chart-wrap { margin:10px 0; }
.chart-frame { width:100%; height:640px; min-height:420px; resize:vertical; border:1px solid var(--line); border-radius:8px; background:#151513; }
.grid > *, .trow > *, .part > * { min-width:0; overflow-wrap:break-word; }
.lead { color:var(--fg); margin:0 0 8px; max-width:70ch; }
.head { color:var(--mut); font-size:13px; }
.num { font-weight:600; font-size:18px; }
.good { color:var(--good); } .mid { color:var(--mid); } .bad { color:var(--bad); } .low { color:var(--mid); }
.why { padding:16px; border-bottom:1px solid var(--line); border-radius:8px; }
.parts { list-style:none; margin:0; padding:0; }
.part { display:grid; grid-template-columns:74px minmax(0,1fr) auto; gap:12px; align-items:start; padding:8px 0; border-bottom:1px solid var(--line); }
.part p { margin:0; color:var(--fg); }
.part strong { color:var(--fg); }
.lv { font-size:12px; font-weight:600; text-align:left; padding:4px 8px; border:1px solid currentColor; border-radius:8px; white-space:nowrap; }
.pts { color:var(--mut); font-size:13px; white-space:nowrap; }
.foot { color:var(--fg); font-size:13px; margin:12px 0 0; }
.trow { display:grid; grid-template-columns:minmax(0,1.2fr) 64px minmax(0,1fr) 64px; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); }
.more { margin-top:8px; }
:focus-visible { outline:2px solid var(--fg); outline-offset:2px; }
@media (max-width:700px) {
  .grid.head { display:none; }
  .grid { grid-template-columns:minmax(0,1fr) minmax(0,1fr); padding:12px 0; }
  .grid > [data-l]::before { content:attr(data-l); display:block; color:var(--mut); font-size:12px; }
  .grid .go, .more { grid-column:1 / -1; min-height:44px; width:100%; }
  .part { grid-template-columns:74px minmax(0,1fr); }
  .part > .pts { grid-column:2; }
  table { font-size:13px; }
  th, td { white-space:normal; padding:6px 4px; }
}
</style>
</head>
<body>
<header>
  <h1>Cheesequake</h1>
  <p class="note">Research tool. Not trading advice. Scores are untested defaults; it never trades.</p>
</header>
<nav role="tablist" id="tabs"></nav>
<main>
  <section id="market"></section>
  <section id="watch" hidden></section>
  <section id="ping" hidden></section>
  <section id="narratives" hidden></section>
  <section id="tracer" hidden></section>
</main>
<script>
'use strict';
// Every API value goes in through textContent; nothing here builds markup from strings.
const B58 = /^[1-9A-HJ-NP-Za-km-z]{32,44}$/;
const SVGNS = 'http://www.w3.org/2000/svg';

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  for (const k of kids.flat()) if (k !== null && k !== undefined) el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return el;
}
function sv(tag, attrs, text) {
  const el = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  if (text !== undefined) el.textContent = text;
  return el;
}
const short = (a) => (a ? a.slice(0, 4) + '…' + a.slice(-4) : '');
const fmt = (n, d = 0) => (n === null || n === undefined ? 'unknown' : Number(n).toLocaleString(undefined, { maximumFractionDigits: d }));
const when = (ts) => new Date(ts * 1000).toLocaleString();
const link = (a) => (B58.test(a || '') ? h('a', { href: 'https://solscan.io/account/' + a, target: '_blank', rel: 'noopener noreferrer' }, short(a)) : short(a));
const card = (title, ...kids) => h('div', { class: 'card' }, h('h2', {}, title), ...kids);
const table = (head, rows) => h('table', {}, h('thead', {}, h('tr', {}, head.map((x) => h('th', {}, x)))), h('tbody', {}, rows.map((r) => h('tr', {}, r.map((c) => h('td', {}, c))))));
const get = async (p) => (await fetch(p)).json();
const put = (id, ...kids) => document.getElementById(id).replaceChildren(...kids);

async function market() {
  const m = await get('/api/market');
  const pts = m.hourly.filter((r) => r.index_value !== null);
  let chart = h('p', { class: 'mut' }, 'Warming up: ' + m.hours + ' of ' + m.warmupHours + ' hours collected.');
  if (m.index.value !== null && pts.length > 1) {
    const W = 800, H = 220, t0 = pts[0].hour, t1 = pts[pts.length - 1].hour || 1;
    const x = (t) => 30 + ((t - t0) / Math.max(1, t1 - t0)) * (W - 40);
    const y = (v) => H - 20 - (v / 100) * (H - 40);
    chart = sv('svg', { viewBox: '0 0 ' + W + ' ' + H, width: W, role: 'img', 'aria-label': 'Trench index, last 30 days' });
    for (const g of [0, 20, 40, 60, 80, 100]) {
      chart.append(sv('line', { x1: 30, x2: W - 10, y1: y(g), y2: y(g), stroke: 'currentColor', 'stroke-opacity': 0.12 }));
      chart.append(sv('text', { x: 2, y: y(g) + 4, 'font-size': 11, fill: 'currentColor' }, g));
    }
    chart.append(sv('polyline', { points: pts.map((r) => x(r.hour) + ',' + y(r.index_value)).join(' '), fill: 'none', stroke: '#c47f00', 'stroke-width': 2 }));
  }
  put('market',
    card('Trench index', h('span', { class: 'big' }, m.index.value === null ? '--' : m.index.value), h('span', { class: 'zone' }, m.index.zone),
      h('p', { class: 'note' }, 'Cold, Cool, Neutral, Hot, Euphoria. Percentile of five launch and trading measures against the last 30 days.')),
    card('Last 30 days', chart));
}

const watchedSet = new Set();
const openCharts = new Set();
let watchInit = null;
let watchInput = '';
function syncWatched(coins) {
  watchedSet.clear();
  for (const c of coins || []) watchedSet.add(c.mint);
  watchInit = Promise.resolve();
}
function ensureWatched() {
  if (!watchInit) {
    watchInit = get('/api/watch').then((d) => {
      if (d && Array.isArray(d.coins)) syncWatched(d.coins);
    });
  }
  return watchInit;
}
async function toggleWatch(mint, after) {
  const method = watchedSet.has(mint) ? 'DELETE' : 'POST';
  const res = await fetch('/api/watch?mint=' + encodeURIComponent(mint), { method });
  const d = await res.json();
  if (d && Array.isArray(d.coins)) syncWatched(d.coins);
  if (after) await after();
}
function watchBtn(mint, after) {
  if (!B58.test(mint || '')) return '';
  const on = watchedSet.has(mint);
  const b = h('button', { class: on ? 'go' : 'go quiet', 'aria-pressed': String(on) }, on ? 'Watching' : 'Watch');
  b.onclick = () => toggleWatch(mint, after);
  return b;
}

const STATUS_CLS = { safe: 'good', caution: 'mid', flag: 'bad' };
const STATUS_LABEL = { safe: 'Safe to hold', caution: 'Caution', flag: 'Red flag' };
const watchedCards = new Map();
let watchFormCard = null;
let watchListWrap = null;
let watchEmptyCard = null;

function updateWatchedCoinCard(entry, c) {
  const cls = STATUS_CLS[c.status] || 'mid';
  const label = c.label || STATUS_LABEL[c.status] || 'Caution';
  const title = c.symbol ? c.symbol + (c.name ? ' (' + c.name + ')' : '') : short(c.mint);
  const scoreTxt = c.score === null || c.score === undefined ? 'unscanned' : c.score + '/100';
  const priceTxt = c.price_usd === null || c.price_usd === undefined ? 'unknown' : '$' + fmt(c.price_usd, 6);
  const mcapTxt = c.mcap_usd === null || c.mcap_usd === undefined ? 'unknown' : '$' + fmt(c.mcap_usd);
  const liqTxt = c.liquidity_usd === null || c.liquidity_usd === undefined ? 'unknown' : '$' + fmt(c.liquidity_usd);
  const reasons = c.reasons || [];
  const badgeText = reasons.length ? label + ' — ' + reasons[0] : label;
  const alerts = c.alerts || [];

  entry.coin = c;
  entry.titleEl.textContent = title;
  entry.badgeEl.className = 'lv ' + cls;
  entry.badgeEl.textContent = badgeText;
  entry.statusBox.className = 'wstatus ' + cls;
  entry.whyStrong.textContent = 'Why ' + label + ':';
  entry.reasonsUl.replaceChildren(...reasons.map((r) => h('li', {}, r)));
  entry.metaEl.replaceChildren(
    h('span', {}, 'Score: ' + scoreTxt),
    h('span', {}, 'Price: ' + priceTxt),
    h('span', {}, 'Market cap: ' + mcapTxt),
    h('span', {}, 'Liquidity: ' + liqTxt));
  entry.alertsWrap.replaceChildren(
    alerts.length
      ? table(['Time', 'Kind', 'Wallet', 'Detail'], alerts.map((a) => [when(a.ts), a.kind, a.wallet ? link(a.wallet) : '', detail(a)]))
      : h('p', { class: 'mut' }, 'No alerts for this coin yet.'));
}

function createWatchedCoinCard(c) {
  const chartOpen = openCharts.has(c.mint);
  const chartBtn = h('button', { class: chartOpen ? 'go' : 'go quiet', 'aria-expanded': String(chartOpen) }, chartOpen ? 'Hide chart' : 'Show chart');
  const unwatchBtn = h('button', { class: 'go quiet' }, 'Unwatch');
  const titleEl = h('h2', {});
  const badgeEl = h('span', { class: 'lv' });
  const whyStrong = h('strong', {});
  const reasonsUl = h('ul', { class: 'wreasons' });
  const statusBox = h('div', { class: 'wstatus' }, whyStrong, reasonsUl);
  const metaEl = h('div', { class: 'wmeta' });
  const alertsWrap = h('div', {});
  const entry = { coin: c, titleEl, badgeEl, whyStrong, reasonsUl, statusBox, metaEl, chartBtn, chartWrap: null, alertsWrap, cardEl: null };

  const makeIframe = () => h('iframe', {
    class: 'chart-frame',
    src: 'https://dexscreener.com/solana/' + encodeURIComponent(entry.coin.pool || entry.coin.mint) + '?embed=1&theme=dark&trades=0&info=0',
    title: (entry.coin.symbol || short(entry.coin.mint)) + ' live chart',
    loading: 'lazy',
  });
  const chartWrap = h('div', chartOpen ? { class: 'chart-wrap' } : { class: 'chart-wrap', hidden: '' }, ...(chartOpen ? [makeIframe()] : []));
  entry.chartWrap = chartWrap;

  unwatchBtn.onclick = async () => {
    openCharts.delete(c.mint);
    const res = await fetch('/api/watch?mint=' + encodeURIComponent(c.mint), { method: 'DELETE' });
    const d = await res.json();
    if (d && Array.isArray(d.coins)) syncWatched(d.coins);
    await watch();
  };
  chartBtn.onclick = () => {
    if (openCharts.has(c.mint)) {
      openCharts.delete(c.mint);
      chartWrap.hidden = true;
      chartWrap.replaceChildren();
    } else {
      openCharts.add(c.mint);
      chartWrap.hidden = false;
      if (!chartWrap.hasChildNodes()) chartWrap.replaceChildren(makeIframe());
    }
    const open = openCharts.has(c.mint);
    chartBtn.textContent = open ? 'Hide chart' : 'Show chart';
    chartBtn.className = open ? 'go' : 'go quiet';
    chartBtn.setAttribute('aria-expanded', String(open));
  };

  entry.cardEl = h('div', { class: 'card' },
    h('div', { class: 'whead' }, titleEl, link(c.mint), badgeEl, h('div', { class: 'acts' }, chartBtn, unwatchBtn)),
    statusBox,
    metaEl,
    chartWrap,
    alertsWrap);
  updateWatchedCoinCard(entry, c);
  return entry;
}

async function watch() {
  const d = await get('/api/watch');
  const coins = (d && d.coins) || [];
  syncWatched(coins);
  const sec = document.getElementById('watch');
  if (!watchFormCard) {
    const input = h('input', { placeholder: 'Coin mint address', 'aria-label': 'Coin mint address', value: watchInput });
    input.oninput = () => { watchInput = input.value; };
    const go = h('button', { class: 'go' }, 'Watch coin');
    const msg = h('p', { class: 'mut' }, 'Watched coins are scanned first on every cycle and monitored for creator sells, tracked-wallet sells, and liquidity drops even if unlisted.');
    go.onclick = async () => {
      const m = input.value.trim();
      if (!B58.test(m)) { msg.textContent = 'That is not a valid Solana mint address.'; return; }
      watchInput = '';
      input.value = '';
      msg.textContent = 'Watched coins are scanned first on every cycle and monitored for creator sells, tracked-wallet sells, and liquidity drops even if unlisted.';
      const res = await fetch('/api/watch?mint=' + encodeURIComponent(m), { method: 'POST' });
      const out = await res.json();
      if (out && Array.isArray(out.coins)) syncWatched(out.coins);
      await watch();
    };
    watchFormCard = card('Watch coins',
      h('p', { class: 'lead' }, 'Pin coins you are holding or watching to track their hold status, red flags, live DexScreener candle chart, and dedicated ping alerts.'),
      input, ' ', go, msg);
    watchListWrap = h('div', {});
    watchEmptyCard = card('Watched coins', h('p', { class: 'mut' }, 'No coins watched yet. Paste a mint address above or click Watch on any coin in Narratives or Ping.'));
  }
  if (!sec.dataset.mounted) {
    sec.setAttribute('data-mounted', '1');
    sec.replaceChildren(watchFormCard, watchListWrap);
  }

  const nextMints = new Set(coins.map((c) => c.mint));
  for (const [m, entry] of watchedCards) {
    if (!nextMints.has(m)) {
      if (entry.cardEl.remove) entry.cardEl.remove();
      else if (watchListWrap.children) watchListWrap.children = watchListWrap.children.filter((x) => x !== entry.cardEl);
      watchedCards.delete(m);
    }
  }
  if (!coins.length) {
    watchListWrap.replaceChildren(watchEmptyCard);
    return;
  }
  if (watchEmptyCard.remove) watchEmptyCard.remove();
  else if (watchListWrap.children) watchListWrap.children = watchListWrap.children.filter((x) => x !== watchEmptyCard);

  for (const c of coins) {
    let entry = watchedCards.get(c.mint);
    if (entry) {
      updateWatchedCoinCard(entry, c);
    } else {
      entry = createWatchedCoinCard(c);
      watchedCards.set(c.mint, entry);
      watchListWrap.append(entry.cardEl);
    }
  }
}

let pingKind = '';
async function ping() {
  const [d] = await Promise.all([get('/api/ping' + (pingKind ? '?kind=' + encodeURIComponent(pingKind) : '')), ensureWatched()]);
  const sel = h('select', { 'aria-label': 'Alert kind' }, ['', 'buy', 'sell', 'consensus', 'exit'].map((k) => h('option', { value: k }, k || 'all')));
  sel.value = pingKind;
  sel.onchange = () => { pingKind = sel.value; ping(); };
  put('ping', card('Wallet activity', sel, d.alerts.length ? table(['Time', 'Kind', 'Coin', 'Wallet', 'Detail', ''],
    d.alerts.map((a) => [when(a.ts), a.kind, [a.symbol ? a.symbol + ' ' : '', link(a.mint)], a.wallet ? link(a.wallet) : '', detail(a), watchBtn(a.mint, ping)]))
    : h('p', { class: 'mut' }, 'No alerts yet.')));
}
function detail(a) {
  const d = a.detail || {};
  if (a.kind === 'consensus') return (d.wallets || []).length + ' wallets, market cap ' + fmt(d.mcap);
  if (d.side !== undefined) return 'creator ' + d.side + (d.usd !== undefined && d.usd !== null ? ' ($' + fmt(d.usd) + ')' : '');
  if (d.usd !== undefined) return '$' + fmt(d.usd);
  if (d.from !== undefined) return 'liquidity $' + fmt(d.from) + ' to $' + fmt(d.to);
  if (d.vol !== undefined && d.buyers !== undefined) return 'vol $' + fmt(d.vol) + ', buyers ' + fmt(d.buyers);
  return '';
}

const PARTS = {
  wallets: {
    name: 'Wallets you follow',
    max: 30,
    levels: {
      Good: 'Multiple tracked wallets hold this coin.',
      OK: 'Some tracked wallets hold this coin.',
      Weak: 'A small amount of tracked-wallet interest, not a strong signal.',
      None: 'None of the wallets you track hold this coin.',
      'No data': 'Could not check tracked wallets.',
    },
  },
  health: {
    name: 'Buyer health',
    max: 25,
    levels: {
      Good: 'New buyers are arriving quickly, buys lead sells, and top holders own a small share.',
      OK: 'New buyers are arriving, buys outnumber sells, and the 10 biggest holders do not own too much.',
      Weak: 'Buyer growth, buy-to-sell balance, or holder spread is weak.',
      None: 'Buyer growth, buy share, and holder spread all scored zero.',
      'No data': 'Missing buyer counts or top-holder data.',
    },
  },
  deployer: {
    name: 'Creator',
    max: 15,
    levels: {
      Good: 'The person who made the coin still holds some and has not been seen selling.',
      OK: 'The person who made the coin has not been seen selling, but holds none of it now.',
      Weak: 'Creator holding or selling signals are weak.',
      None: 'The person who made the coin has been seen selling.',
      'No data': 'The creator address is not available.',
    },
  },
  liquidity: {
    name: 'Easy to sell',
    max: 15,
    levels: {
      Good: 'There is enough money in the trading pool, and it is locked so nobody can pull it out.',
      OK: 'The trading pool has moderate depth or lock coverage.',
      Weak: 'The trading pool is thin compared with the coin\'s size, so selling may move the price.',
      None: 'The trading pool has no usable depth or lock score.',
      'No data': 'Could not check pool depth or whether liquidity is locked.',
    },
  },
  momentum: {
    name: 'Momentum',
    max: 10,
    levels: {
      Good: 'Trading in the last hour is much faster than its 6-hour pace.',
      OK: 'Trading in the last hour is picking up compared with its 6-hour pace.',
      Weak: 'Trading in the last hour is only slightly above its 6-hour pace.',
      None: 'Trading in the last hour is at or below its 6-hour pace.',
      'No data': 'Missing 1-hour or 6-hour trading volume.',
    },
  },
  narrative: {
    name: 'Theme',
    max: 5,
    levels: {
      Good: (t) => (t ? 'It belongs to the "' + t + '" theme, which grew this hour.' : 'It belongs to a theme that grew this hour.'),
      OK: (t) => (t ? 'It belongs to the "' + t + '" theme, which held steady or cooled this hour.' : 'It belongs to a theme that held steady or cooled this hour.'),
      Weak: (t) => (t ? 'It belongs to the "' + t + '" theme, with weak theme growth.' : 'It belongs to a theme with weak growth.'),
      None: 'It does not share a theme word with other trending coins this hour.',
      'No data': 'Theme data was not available.',
    },
  },
};
const BANDS = {
  strong: { label: 'Strong', cls: 'good' },
  confirm: { label: 'Promising', cls: 'good' },
  neutral: { label: 'Mixed', cls: 'mid' },
  risk: { label: 'Weak', cls: 'low' },
  avoid: { label: 'Very weak', cls: 'bad' },
};
const UNKNOWNS = {
  mint_authority: 'mint permission check',
  freeze_authority: 'freeze permission check',
  rugged: 'rug-pull check',
  transfer_fee: 'transfer fee check',
  lp_unlocked: 'locked pool check',
  top10: 'top 10 holders check',
  insiders: 'insider wallets check',
  liquidity: 'easy to sell',
  age: 'coin age check',
  wash: 'fake volume check',
  wallets: 'wallets you follow',
  health: 'buyer health',
  deployer: 'creator',
  momentum: 'momentum',
  narrative: 'theme',
};
const LEVEL_CLS = { Good: 'good', OK: 'mid', Weak: 'low', None: 'bad', 'No data': 'mut' };
const bandInfo = (b) => BANDS[b] || { label: b || 'unknown', cls: 'mut' };
const missingList = (xs) => [...new Set((xs || []).map((k) => UNKNOWNS[k] || k))].join(', ') || 'none';
function explainPart(key, reason, unknowns, theme) {
  const def = PARTS[key];
  const max = reason ? reason.max : def.max;
  const pts = reason ? reason.points : 0;
  const isUnknown = !reason || (unknowns || []).includes(key);
  let level = 'None';
  if (isUnknown) level = 'No data';
  else if (pts <= 0) level = 'None';
  else {
    const ratio = max > 0 ? pts / max : 0;
    level = ratio >= 0.75 ? 'Good' : ratio >= 0.4 ? 'OK' : 'Weak';
  }
  const raw = def.levels[level];
  const text = typeof raw === 'function' ? raw(theme) : raw;
  return { name: def.name, level, cls: LEVEL_CLS[level], text, points: pts, max };
}

const openMints = new Set();
function renderRunning(running) {
  if (!running.length) return [h('p', { class: 'mut' }, 'Nothing has passed every safety check in the last 30 minutes.')];
  const head = h('div', { class: 'grid head' }, ['Coin', 'Theme', 'Score', 'Reading', 'Market cap', 'Missing data', ''].map((x) => h('span', {}, x)));
  const rows = [];
  for (const r of running) {
    const isOpen = openMints.has(r.mint);
    const bi = bandInfo(r.band);
    const coin = r.symbol ? [h('strong', {}, r.symbol), ' ', link(r.mint)] : [h('strong', {}, link(r.mint))];
    const mcap = r.mcap_usd === null || r.mcap_usd === undefined ? 'unknown' : '$' + fmt(r.mcap_usd);
    const btn = h('button', { class: isOpen ? 'go' : 'go quiet', 'aria-expanded': String(isOpen) }, isOpen ? 'Hide' : 'Explain score');
    const row = h('div', { class: 'grid' },
      h('span', {}, ...coin),
      h('span', { 'data-l': 'Theme' }, r.theme || 'no theme'),
      h('span', { class: 'num', 'data-l': 'Score' }, r.score),
      h('span', { class: bi.cls, 'data-l': 'Reading' }, bi.label),
      h('span', { 'data-l': 'Market cap' }, mcap),
      h('span', { 'data-l': 'Missing data' }, missingList(r.unknowns)),
      h('div', { class: 'acts' }, btn, watchBtn(r.mint, narratives)));
    const byPart = new Map((r.reasons || []).map((x) => [x.part, x]));
    const items = Object.keys(PARTS).map((k) => {
      const p = explainPart(k, byPart.get(k), r.unknowns, r.theme);
      return h('li', { class: 'part' },
        h('span', { class: 'lv ' + p.cls }, p.level),
        h('div', {}, h('strong', {}, p.name), h('p', {}, p.text)),
        h('span', { class: 'pts' }, p.points + ' of ' + p.max));
    });
    const why = h('div', isOpen ? { class: 'why' } : { class: 'why', hidden: '' },
      h('ul', { class: 'parts' }, items),
      h('p', { class: 'foot' }, 'Missing data counts as 0 points and caps the score at 79.'));
    btn.onclick = () => {
      if (openMints.has(r.mint)) openMints.delete(r.mint);
      else openMints.add(r.mint);
      const open = openMints.has(r.mint);
      why.hidden = !open;
      btn.textContent = open ? 'Hide' : 'Explain score';
      btn.className = open ? 'go' : 'go quiet';
      btn.setAttribute('aria-expanded', String(open));
    };
    rows.push(row, why);
  }
  return [head, ...rows];
}

let showAllThemes = false;
function renderThemes(themes) {
  const wrap = h('div', {});
  const draw = () => {
    if (!themes.length) {
      wrap.replaceChildren(h('p', { class: 'mut' }, 'No themes yet.'));
      return;
    }
    const list = showAllThemes ? themes : themes.slice(0, 5);
    const kids = [
      h('div', { class: 'trow head' }, ['Word', 'Coins', 'Traded, 1 h', 'Share'].map((x) => h('span', {}, x))),
      ...list.map((t) => h('div', { class: 'trow' }, [t.keyword, t.tokens, '$' + fmt(t.volume), fmt(t.share * 100, 1) + '%'].map((x) => h('span', {}, x)))),
    ];
    if (themes.length > 5) {
      const toggle = h('button', { class: 'go quiet more' }, showAllThemes ? 'Show top 5' : 'Show all ' + themes.length + ' themes');
      toggle.onclick = () => { showAllThemes = !showAllThemes; draw(); };
      kids.push(toggle);
    }
    wrap.replaceChildren(...kids);
  };
  draw();
  return wrap;
}

async function narratives() {
  const [n] = await Promise.all([get('/api/narratives'), ensureWatched()]);
  const calEmpty = 'No results yet. The tool checks each coin\'s price 1, 6 and 24 hours later.' + (n.calibration.missed ? ' Missed: ' + n.calibration.missed + '.' : '');
  put('narratives',
    card('Running now',
      h('p', { class: 'lead' }, 'Coins that passed every safety check in the last 30 minutes, best score first. The score is out of 100 and counts good signs. It is not a prediction.'),
      ...renderRunning(n.running)),
    card('Themes this hour',
      h('p', { class: 'lead' }, 'A theme is a word that three or more trending coins share in their name or description. Share is how much of the last hour\'s trading went to coins with that word.'),
      renderThemes(n.themes)),
    card('Best calls: wallet scorecard',
      h('p', { class: 'lead' }, 'How tracked wallets have performed on their recorded trades.'),
      n.wallets.length ? table(['Wallet', 'Class', 'Bought', 'Win rate', 'Median hold (s)', 'Still holding'],
        n.wallets.map((w) => [
          w.label ? w.label + ' ' : '',
          w.class,
          w.bought,
          w.winRate === null ? 'not enough trades yet' : fmt(w.winRate * 100) + '%',
          w.medianHoldSeconds === null || w.medianHoldSeconds === undefined ? 'not enough trades yet' : fmt(w.medianHoldSeconds),
          w.stillHoldingShare === null ? 'not enough trades yet' : fmt(w.stillHoldingShare * 100) + '%',
        ]).map((r, i) => [[r[0], link(n.wallets[i].address)], ...r.slice(1)]))
        : h('p', { class: 'mut' }, 'No wallets tracked. Add some to wallets.txt.')),
    card('Calibration: later price by score band',
      h('p', { class: 'lead' }, 'Checks each coin\'s price 1, 6 and 24 hours after scoring.'),
      n.calibration.rows.length ? table(['Band', 'Horizon', 'Count', 'Mean change', 'Share up'],
        n.calibration.rows.map((r) => [bandInfo(r.band).label, r.horizon_h + ' h', r.count, fmt(r.meanChangePct, 1) + '%', fmt(r.positiveShare * 100) + '%']))
        : h('p', { class: 'mut' }, calEmpty)));
}

const TYPE_COLOR = { exchange: '#2b7a3d', mixer: '#b3261e', other: '#c47f00' };
let traceWallet = '';
function tracerView(t) {
  const out = [h('p', {}, 'Status: ' + t.status)];
  if (t.nodes && t.nodes.length) {
    const cols = {};
    t.nodes.forEach((n) => (cols[n.depth] = cols[n.depth] || []).push(n));
    const depth = Math.max(...Object.keys(cols).map(Number)) + 1;
    const rows = Math.max(...Object.values(cols).map((c) => c.length));
    const W = depth * 190 + 20, H = rows * 56 + 20;
    const pos = {};
    for (const [d, list] of Object.entries(cols)) list.forEach((n, i) => (pos[n.address] = { x: 10 + d * 190, y: 10 + i * 56 }));
    const svg = sv('svg', { viewBox: '0 0 ' + W + ' ' + H, width: W, role: 'img', 'aria-label': 'Fund flow' });
    for (const e of t.edges) {
      const a = pos[e.from], b = pos[e.to];
      if (!a || !b) continue;
      svg.append(sv('line', { x1: a.x + 150, y1: a.y + 20, x2: b.x, y2: b.y + 20, stroke: 'currentColor', 'stroke-opacity': 0.4 }));
      svg.append(sv('text', { x: (a.x + 150 + b.x) / 2, y: (a.y + b.y) / 2 + 14, 'font-size': 10, fill: 'currentColor' }, '$' + fmt(e.usd)));
    }
    for (const n of t.nodes) {
      const p = pos[n.address];
      svg.append(sv('rect', { x: p.x, y: p.y, width: 150, height: 40, rx: 6, fill: 'none', stroke: TYPE_COLOR[n.type] || 'currentColor', 'stroke-width': n.type ? 2 : 1 }));
      svg.append(sv('text', { x: p.x + 8, y: p.y + 17, 'font-size': 12, fill: 'currentColor' }, n.label || short(n.address)));
      svg.append(sv('text', { x: p.x + 8, y: p.y + 32, 'font-size': 10, fill: 'currentColor', 'fill-opacity': 0.6 }, n.type ? n.type : short(n.address)));
    }
    out.push(svg);
  }
  return out;
}
async function tracer() {
  const t = traceWallet ? await get('/api/tracer?wallet=' + encodeURIComponent(traceWallet)) : null;
  const input = h('input', { placeholder: 'Start wallet address', 'aria-label': 'Start wallet address', value: traceWallet });
  const go = h('button', { class: 'go' }, 'Trace');
  const msg = h('p', { class: 'mut' }, 'Follows where the money went, hop by hop. Labelled destinations stop the trace; labels come from data/labels.json.');
  go.onclick = () => { if (!B58.test(input.value.trim())) { msg.textContent = 'That is not a valid wallet address.'; return; } traceWallet = input.value.trim(); tracer(); };
  put('tracer', card('Tracer', input, ' ', go, msg, t && t.error ? t.error : t ? tracerView(t) : null));
}

const TABS = { market, watch, ping, narratives, tracer };
let current = 'market';
function show(name) {
  current = name;
  document.querySelectorAll('nav button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  for (const id of Object.keys(TABS)) document.getElementById(id).hidden = id !== name;
  if (!document.getElementById(name).hasChildNodes()) put(name, h('p', { class: 'mut' }, 'Loading…'));
  refresh();
}
const refresh = () => TABS[current]().catch((e) => put(current, h('p', { class: 'mut' }, 'Could not load: ' + e.message)));
const nav = document.getElementById('tabs');
for (const name of Object.keys(TABS)) {
  const b = h('button', { role: 'tab', 'data-tab': name }, name[0].toUpperCase() + name.slice(1));
  b.onclick = () => show(name);
  nav.append(b);
}
show('market');
setInterval(refresh, 30000);
</script>
